                          }`}

                          <span className="text-[9px] font-semibold px-1.5 py-0.2 bg-[#FFEAF1] text-[#A52E5D] rounded-full">{c.badge}</span>

                      <div className="grid grid-cols-4 gap-1.5">
                        {netflix2U.map((item, idx) => (

                      target="_blank"
                      rel="noopener noreferrer"

            <div className="max-w-7xl mx-auto px-4">
              <p className="font-heading text-base font-bold text-[#A52E5D]">Kazuya Store</p>
              <p className="text-[11px] mb-3">WhatsApp Resmi: {STORE_PHONE_DISPLAY} • Jam Operasional: 08:00 - 23:00 WIB</p>

              {/* Official Social Media in Footer */}
              <div className="flex items-center justify-center gap-3 mb-4">
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" className="boutique-btn p-1.5 rounded-xl bg-white border border-[#F8C8DA] shadow-sm hover:scale-105" title="Official Instagram">
                  <InstagramOfficialLogo className="w-5 h-5" />

                <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" className="boutique-btn p-1.5 rounded-xl bg-white border border-[#F8C8DA] shadow-sm hover:scale-105" title="Official TikTok">

            >
              <WhatsAppOfficialLogo className="w-7 h-7" variant="white" />

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
